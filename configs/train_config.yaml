# Configuration file for training script
# Stores all parameters and file paths used by train.py


paths:
  # Folder containing processed training data
  data_dir: data/processed

  # Name of the training CSV file
  train_filename: Go_auto_train_data.csv

  # Name of the test CSV file
  test_filename: Go_auto_test_data.csv

  # Folder containing the trained models
  model_dir: models

features:
  # List of 10 selected features used for training
  selected:
    - month_listed
    - number_price_changes
    - discount
    - model
    - mileage
    - price_imputed
    - make
    - msrp
    - years_on_market
    - wheelbase_from_vin
  target: days_on_market
  
segmentation:
  # MSRP segmentation bins (use .inf to represent infinity in YAML)
  msrp_bins: [0, 33650, 61500, .inf]

  # MSRP segmentation labels for bins above
  msrp_labels:
    - 'Low (<33.6k)'
    - 'Medium (33.6k-61.5k)'
    - 'High (>61.5k)'

  # Whether the segmentation bins are right-closed (False = left-closed)
  right_closed: False

model:
  # Best hyperparameters for Random Forest Regressor
  best_params:
    n_estimators: 350         # Number of trees in the forest
    min_samples_split: 5      # Minimum samples required to split a node
    min_samples_leaf: 2       # Minimum samples required at a leaf node
    max_features: 0.5         # Fraction of features considered per split
    max_depth: 35             # Maximum depth of the tree
    random_state: 42          # Random seed for reproducibility  

